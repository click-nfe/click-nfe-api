services:
  postgres:
    image: postgres:16-alpine
    container_name: click-nfe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-click_nfe}
      POSTGRES_USER: ${POSTGRES_USER:-click_nfe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-click_nfe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - click_nfe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-click_nfe} -d ${POSTGRES_DB:-click_nfe}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  click_nfe_postgres_data:
