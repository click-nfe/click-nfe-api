# Trigger this build with approval on the protected production branch.
# The migration job must finish successfully before Cloud Run receives the new image.
substitutions:
  _REGION: southamerica-east1
  _AR_REPOSITORY: click-nfe
  _SERVICE: click-nfe-api

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=runtime
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - id: prepare-migration
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_SERVICE}-migrate
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --service-account=click-nfe-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --command=flask
      - --args=--app,wsgi.py,db,upgrade
      - --tasks=1
      - --max-retries=0
      - --task-timeout=600s
      - --update-env-vars=APP_ENV=production
      - --update-secrets=DATABASE_URL=click-nfe-database-url:1,SECRET_KEY=click-nfe-secret-key:1

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_SERVICE}-migrate
      - --region=${_REGION}
      - --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --service-account=click-nfe-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --update-env-vars=APP_ENV=production,WEB_CONCURRENCY=1
      - --update-secrets=DATABASE_URL=click-nfe-database-url:1,SECRET_KEY=click-nfe-secret-key:1
      - --max=1
      - --concurrency=8
      - --no-invoker-iam-check

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
